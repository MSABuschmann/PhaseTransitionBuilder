[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ptbuilder"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "matplotlib",
    "cosmoTransitions",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ptbuilder*"]
